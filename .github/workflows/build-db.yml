name: Build Database

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Database version (YYYYMMDDHHMM, leave empty for auto-detect)'
        required: false
        type: string

env:
  DB_DIR: db

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install UnityPy requests

      - name: Extract database
        id: extract
        env:
          DB_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -z "$DB_VERSION" ]; then
            echo "Auto-detecting latest version..."
            DB_VERSION=$(python .github/scripts/detect_version.py)
            if [ -z "$DB_VERSION" ]; then
              echo "ERROR: Could not auto-detect version. Please provide version manually."
              exit 1
            fi
          fi
          echo "Extracting database version: $DB_VERSION"
          python .github/scripts/extract_db.py --version "$DB_VERSION" --output-dir ${{ env.DB_DIR }}
          echo "DB_VERSION=$DB_VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: db-v${{ steps.extract.outputs.DB_VERSION }}
          name: Database v${{ steps.extract.outputs.DB_VERSION }}
          body: |
            Auto-generated database release v${{ steps.extract.outputs.DB_VERSION }}
          draft: false
          prerelease: false
          files: |
            ${{ env.DB_DIR }}/*.db
            ${{ env.DB_DIR }}/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
