name: Build Database

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Database version (YYYYMMDDHHMM, default: current time)'
        required: false
        type: string

env:
  DB_DIR: db

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install UnityPy requests

      - name: Extract database
        id: extract
        env:
          DB_VERSION: ${{ inputs.version || env.DB_VERSION || '' }}
          BILI_ASSET_URL: ${{ vars.BILI_ASSET_URL || 'https://l1-prod-patch-gzlj.bilibiligame.net/client_ob_771/AssetBundles/Android/masterdata_master.unity3d' }}
        run: |
          VERSION=${{ inputs.version }}
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y%m%d%H%M)
          fi
          echo "Extracting database version: $VERSION"
          python .github/scripts/extract_db.py --version "$VERSION" --output-dir ${{ env.DB_DIR }}

          echo "DB_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DB_DIR=${{ env.DB_DIR }}" >> $GITHUB_OUTPUT

      - name: Display extracted files
        run: |
          echo "Extracted files:"
          ls -la ${{ env.DB_DIR }}/

          echo ""
          echo "manifest.json content:"
          cat ${{ env.DB_DIR }}/manifest.json

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: db-v${{ steps.extract.outputs.DB_VERSION }}
          name: Database v${{ steps.extract.outputs.DB_VERSION }}
          body: |
            Auto-generated database release v${{ steps.extract.outputs.DB_VERSION }}

            ## Contents
            - `${{ env.DB_DIR }}/${{ steps.extract.outputs.DB_VERSION }}.db` - SQLite database
            - `${{ env.DB_DIR }}/manifest.json` - Metadata and checksums

            ## Extraction Info
            - Extracted at: ${{ github.event.workflow_run.created_at }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## Usage
            Download the manifest.json to check for updates:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
            ```
          draft: false
          prerelease: false
          files: |
            ${{ env.DB_DIR }}/*.db
            ${{ env.DB_DIR }}/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        if: steps.create-release.outputs.id != ''
        run: |
          echo "Release created successfully!"
          echo "URL: ${{ steps.create-release.outputs.url }}"
