name: Build Database

on:
  schedule:
    # Avoid the busiest start-of-hour window for scheduled Actions.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Database version (YYYYMMDDHHMM; empty means live auto-detect)"
        required: false
        type: string
      force:
        description: "Rebuild and replace an existing release"
        required: false
        default: false
        type: boolean

concurrency:
  group: database-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DB_DIR: db
  RAINBOW_PATH: _autopcr/data/rainbow.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve database version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            DB_VERSION="$REQUESTED_VERSION"
          else
            DB_VERSION="$(python .github/scripts/detect_version.py)"
          fi
          if [[ ! "$DB_VERSION" =~ ^[0-9]{12}$ ]]; then
            echo "Invalid database version: $DB_VERSION" >&2
            exit 1
          fi
          echo "Resolved database version: $DB_VERSION"
          echo "value=$DB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DB_VERSION: ${{ steps.version.outputs.value }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          if gh release view "db-v$DB_VERSION" >/dev/null 2>&1; then
            echo "Release db-v$DB_VERSION already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "db-v$DB_VERSION" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout AutoPCR database mapping
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@v5
        with:
          repository: cc004/autopcr
          ref: main
          path: _autopcr
          sparse-checkout: data/rainbow.json
          sparse-checkout-cone-mode: false

      - name: Extract and validate database
        if: steps.release.outputs.build == 'true'
        env:
          DB_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          python .github/scripts/extract_db.py
          --version "$DB_VERSION"
          --output-dir "$DB_DIR"
          --rainbow "$RAINBOW_PATH"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-build-${{ steps.version.outputs.value }}
          path: ${{ env.DB_DIR }}/
          if-no-files-found: ignore

      - name: Publish database release
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DB_VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="db-v$DB_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DB_DIR/$DB_VERSION.db" "$DB_DIR/manifest.json" --clobber
          else
            gh release create "$TAG" \
              "$DB_DIR/$DB_VERSION.db" "$DB_DIR/manifest.json" \
              --title "Database v$DB_VERSION" \
              --notes "Auto-generated, restored, and validated database v$DB_VERSION"
          fi

      - name: Record latest published version
        if: steps.release.outputs.build == 'true'
        env:
          DB_VERSION: ${{ steps.version.outputs.value }}
        run: |
          printf '%s\n' "$DB_VERSION" > latest-version.txt
          git add latest-version.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish database $DB_VERSION"
          git push
